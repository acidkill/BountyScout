name: Private BountyScout

on:
  schedule:
    # Hourly trigger; the Python Europe/Oslo guard selects every third
    # weekday hour and every weekend hour, including DST transitions.
    - cron: "0 * * * *"
    # Local 08:30 is 06:30 UTC in summer and 07:30 UTC in winter.
    - cron: "30 6,7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run never sends or persists; trial only on 2026-09-25 at 16:00 Oslo"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - ping
          - trial
          - scan
          - digest

concurrency:
  group: bounty-scout-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install ruff==0.16.0 pytest
      - name: Verify
        run: |
          ruff check .
          ruff format --check .
          pytest -q
      - name: Run private scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$SCHEDULE" = "0 * * * *" ]; then mode=scan; else mode=digest; fi
          else
            mode="$REQUESTED_MODE"
          fi
          python scout_bounties.py --mode "$mode"
      - name: Persist acknowledged delivery state
        if: ${{ always() && hashFiles('scout_state.json') != '' }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- scout_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist confirmed Telegram deliveries [skip ci]"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
